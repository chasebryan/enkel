[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enkel-core"
version = "0.1.0"
description = "A deterministic formal layer beneath English"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
enkel = "enkel.__main__:main"

[tool.setuptools]
packages = ["enkel"]
